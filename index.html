function songCard(side, idx){
  const s = S.songs[idx];
  return `<article class="card ${side}" id="card-${side}">
    <div class="frame"><div id="yt-${side}"></div></div>
    <div class="label"><h2 class="song">${esc(s[1])}</h2><span class="game">${esc(s[0])}</span></div>
    <div class="score" id="score-${side}" hidden></div>
    <div class="who" id="who-${side}"></div>
    <button class="vote" data-act="vote" data-side="${side}" aria-pressed="false">Votar</button>
  </article>`;
}

function renderStage(){
  const {r, m} = S.cur, [ia, ib] = pair(S, r, m);
  return `<section>
    <div class="meta"><span class="round">${esc(roundName(S, r))}</span><span class="count"><b>${m+1}</b>/${matchesIn(S, r)} · <span id="played">${doneMatches(S)}</span>/${sizeOf(S)-1} jugados</span></div>
    <div class="vs">${songCard("a", ia)}<div class="vs-mark" aria-hidden="true">VS</div>${songCard("b", ib)}</div>
    <div class="meter" aria-hidden="true"><i class="ma" id="ma"></i><i class="mb" id="mb"></i></div>
    <div class="voters" id="voters"></div>
    <div id="ctrl"></div>
  </section>`;
}

/* partes del duelo que cambian sin recargar los vídeos */
function renderStageState(){
  if (tab !== "duel" || !S || S.status === "done" || !$("#card-a")) return;
  const {r, m} = S.cur, [ia, ib] = pair(S, r, m), w = S.rounds[r+1][m];
  [["a", ia], ["b", ib]].forEach(([side, idx]) => {
    const card = $("#card-" + side);
    card.classList.toggle("lose", w !== null && w !== idx);
    let crown = card.querySelector(".crown");
    if (w === idx && !crown) { crown = document.createElement("span"); crown.className = "crown"; crown.textContent = "Pasa de ronda"; card.prepend(crown); }
    if (w !== idx && crown) crown.remove();
  });
  const pl = $("#played"); if (pl) pl.textContent = doneMatches(S);
  const ctrl = $("#ctrl"); if (!ctrl) return;
  if (role === "host") {
    const mm = S.manual || {a:0,b:0};
    let c = "";
    if (S.status === "voting") c = `<div class="row"><button class="btn primary" data-act="close">Cerrar votación</button></div>
      <div class="manual"><span>Votos a mano (amigos en la misma habitación):</span>
      <span class="grp"><button class="sq a" data-act="man" data-side="a" data-d="-1" aria-label="Quitar voto a la izquierda">−</button><b>${mm.a||0}</b><button class="sq a" data-act="man" data-side="a" data-d="1" aria-label="Sumar voto a la izquierda">+</button></span>
      <span class="grp"><button class="sq b" data-act="man" data-side="b" data-d="-1" aria-label="Quitar voto a la derecha">−</button><b>${mm.b||0}</b><button class="sq b" data-act="man" data-side="b" data-d="1" aria-label="Sumar voto a la derecha">+</button></span></div>`;
    else if (S.status === "tie" || S.status === "mini") c = `<div class="row"><strong>¡Empate ${S.reveal ? S.reveal.a + "–" + S.reveal.b : ""}!</strong>
        ${S.status === "mini" ? `<span>Minijuego de desempate en marcha…</span>` : `<button class="btn primary" data-act="mini">Jugar minijuego</button>`}
        <button class="btn" data-act="pick" data-side="a" style="color:var(--p1)">Gana ${esc(S.songs[ia][1])}</button>
        <button class="btn" data-act="pick" data-side="b" style="color:var(--p2)">Gana ${esc(S.songs[ib][1])}</button>
        <button class="btn ghost" data-act="coin">Lanzar moneda</button>
        <button class="btn ghost" data-act="reopen">Volver a votar</button></div>`;
    else c = miniBanner() + `<div class="row"><button class="btn primary" data-act="next">${r === lastRound(S) ? "Coronar campeona" : "Siguiente duelo"}</button><button class="btn ghost" data-act="reopen">Repetir votación</button></div>`;
    const reset = confirmReset
      ? `<div class="confirm">¿Borrar el torneo en curso? Se pierden todos los resultados. <button class="btn danger" data-act="reset-yes">Sí, reiniciar</button><button class="btn ghost" data-act="reset-no">Cancelar</button></div>`
      : `<div><button class="btn ghost sm" data-act="reset">Reiniciar torneo</button></div>`;
    ctrl.innerHTML = `<section class="host"><div class="host-h">Panel del anfitrión</div>${c}${reset}</section>`;
  } else {
    ctrl.innerHTML = S.status === "tie" || S.status === "mini" ? `<div class="notice" style="margin-top:16px"><strong>Empate ${S.reveal ? S.reveal.a + "–" + S.reveal.b : ""}.</strong> Se decide con un minijuego.</div>`
      : S.status === "reveal" ? miniBanner() + `<div class="notice" style="margin-top:16px">Esperando a que el anfitrión pase al siguiente duelo.</div>` : "";
  }
}

function renderLive(){
  setNet(netOverride);
  const vEl = $("#voters");
  if (!S || S.status === "done" || !$("#card-a")) {
    if (vEl) { const t = tally(); vEl.innerHTML = `<span class="lbl">En la sala</span>` + t.list.map(v => `<span class="pill ${v.on ? "" : "off"}"><i></i>${esc(v.nick)}${v.me ? " (tú)" : ""}</span>`).join(""); }
    return;
  }
  const k = keyOf(S), me = voters[myId], mine = me && me.k === k ? me.s : null;
  const voting = S.status === "voting";
  ["a","b"].forEach(side => {
    const card = $("#card-" + side), btn = card.querySelector(".vote"), picked = mine === side;
    card.classList.toggle("picked", picked && voting);
    btn.disabled = !voting; btn.setAttribute("aria-pressed", String(picked));
    btn.textContent = picked ? "Tu voto ✓" : voting ? "Votar" : "Votación cerrada";
  });
  const t = tally();
  const a = voting ? t.a : (S.reveal ? S.reveal.a : 0), b = voting ? t.b : (S.reveal ? S.reveal.b : 0);
  const show = !voting || !S.hidden;
  const sa = $("#score-a"), sb = $("#score-b");
  sa.hidden = sb.hidden = !show;
  if (show) { sa.innerHTML = a + "<small>votos</small>"; sb.innerHTML = b + "<small>votos</small>"; }
  const tot = a + b;
  $("#ma").style.width = show && tot ? (a/tot*100) + "%" : "0%";
  $("#mb").style.width = show && tot ? (b/tot*100) + "%" : "0%";
  const mm = S.manual || {a:0,b:0}, votedN = t.list.filter(v => v.s).length + (mm.a||0) + (mm.b||0);
  const [ia, ib] = pair(S, S.cur.r, S.cur.m), title = side => S.songs[side === "a" ? ia : ib][1];
  /* después de cerrar se usa la foto guardada de quién votó qué */
  const saved = !voting && S.who ? S.who[S.cur.r + "-" + S.cur.m] : null;
  ["a", "b"].forEach(side => {
    const box = $("#who-" + side); if (!box) return;
    if (!show) { box.innerHTML = ""; return; }
    const names = saved ? saved[side].map(n => ({nick: n, me: n === (voters[myId] || {}).nick}))
      : t.list.filter(v => v.s === side).map(v => ({nick: v.nick, me: v.me}));
    const man = saved ? saved["m" + side] : (mm[side] || 0);
    box.innerHTML = names.length || man ? `<span class="lbl">La han votado:</span>` + names.map(n => `<span class="nm ${n.me ? "me" : ""}">${esc(n.nick)}</span>`).join("") + (man ? `<span class="nm">+${man} a mano</span>` : "") : `<span class="lbl">Nadie la ha votado</span>`;
  });
  vEl.innerHTML = `<span class="lbl">${voting ? (votedN + " de " + (t.list.filter(v => v.on).length + (mm.a||0) + (mm.b||0)) + " han votado") : "Votos"}</span>` + t.list.map(v => {
    const c = v.s ? (S.hidden && voting ? "voted" : "s" + v.s) : "";
    const tail = v.s ? (S.hidden && voting ? ` <span class="arrow">✓ ya ha votado</span>` : ` <span class="arrow">→ ${esc(title(v.s))}</span>`) : (voting && v.on ? ` <span class="arrow">· pensando…</span>` : "");
    return `<span class="pill ${c} ${v.on ? "" : "off"}"><i></i>${esc(v.nick)}${v.me ? " (tú)" : ""}${tail}</span>`;
  }).join("");
}

function renderBracket(){
  if (!S) return `<div class="notice">Todavía no hay torneo.</div>`;
  const nR = lastRound(S) + 1;
  if (bracketRound === null || bracketRound >= nR) bracketRound = S.status === "done" ? nR - 1 : S.cur.r;
  const tabs = Array.from({length: nR}, (_, r) => `<button data-act="rtab" data-v="${r}" aria-pressed="${r === bracketRound}">${esc(roundName(S, r))}</button>`).join("");
  const r = bracketRound, items = [];
  for (let m = 0; m < matchesIn(S, r); m++) {
    const [ia, ib] = pair(S, r, m), w = S.rounds[r+1][m], sc = S.scores[r + "-" + m];
    const now = S.status !== "done" && S.cur.r === r && S.cur.m === m;
    const line = (side, idx, n) => {
      if (idx === null) return `<div class="ln ${side} tbd"><i></i><span class="t">Por decidir</span><span class="n"></span></div>`;
      const s = S.songs[idx], st = w === null ? "" : (w === idx ? " w" : " l");
      return `<div class="ln ${side}${st}"><i></i><span class="t" title="${esc(s[0] + " — " + s[1])}">${esc(s[1])} <em>· ${esc(s[0])}</em></span><span class="n">${sc ? n : ""}</span></div>`;
    };
    const wv = S.who && S.who[r + "-" + m], ml = S.miniLog && S.miniLog[r + "-" + m];
    const names = (arr, man) => (arr.length ? arr.map(esc).join(", ") : "nadie") + (man ? ` (+${man} a mano)` : "");
    const extra = wv ? `<div class="wv"><span class="va">▲ ${names(wv.a, wv.ma)}</span><span class="vb">▼ ${names(wv.b, wv.mb)}</span>${ml ? `<span>Desempate: ${esc(ml.g === "coin" ? "moneda" : ml.g === "pick" ? "decidió el anfitrión" : ((gameById(ml.g) || {}).name || "minijuego") + " " + ml.a + "–" + ml.b)}</span>` : ""}</div>` : "";
    items.push(`<div class="m${now ? " now" : ""}"><div class="mh"><span>Duelo ${m+1}</span>${now ? `<span class="live">En juego</span>` : ""}</div>${line("a", ia, sc && sc[0])}${line("b", ib, sc && sc[1])}${extra}</div>`);
  }
  return `<div class="rtabs">${tabs}</div><div class="matches">${items.join("")}</div>`;
}

function renderChampion(){
  const fin = lastRound(S), w = S.rounds[fin+1][0], s = S.songs[w], rows = [];
  for (let r = 0; r <= fin; r++) for (let m = 0; m < matchesIn(S, r); m++) {
    const [ia, ib] = pair(S, r, m); if (ia !== w && ib !== w) continue;
    const opp = ia === w ? ib : ia, sc = S.scores[r + "-" + m] || [0,0];
    rows.push(`<tr><td>${esc(roundName(S, r))}</td><td>${esc(S.songs[opp][1])} <span style="color:var(--muted)">· ${esc(S.songs[opp][0])}</span></td><td class="n">${ia === w ? sc[0] : sc[1]} – ${ia === w ? sc[1] : sc[0]}</td></tr>`);
  }
  const reset = role === "host" ? (confirmReset
    ? `<div class="confirm">¿Borrar este torneo y volver a empezar? <button class="btn danger" data-act="reset-yes">Sí, nuevo torneo</button><button class="btn ghost" data-act="reset-no">Cancelar</button></div>`
    : `<button class="btn primary" data-act="reset">Nuevo torneo</button>`) : "";
  return `<section class="champ">
    <span class="eyebrow">Campeona de ${sizeOf(S)} canciones</span>
    <h1>${esc(s[1])}</h1><div class="g">${esc(s[0])}</div>
    <div class="frame" style="width:100%"><div id="yt-c"></div></div>
    <div class="tbl"><table class="path"><thead><tr><th>Ronda</th><th>Rival</th><th style="text-align:right">Votos</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>
    ${reset}
  </section>`;
}

function renderTop(){
  const rows = topStats();
  const recs = Object.values(hist).sort((a, b) => b.u - a.u).slice(0, 15);
  const fmtD = ms => { try { return new Date(ms).toLocaleString("es-ES", {day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit"}); } catch { return ""; } };
  const back = role ? "" : `<div><button class="btn ghost" data-act="home">← Volver</button></div>`;
  const table = rows.length ? `<div class="scroll"><table class="rank"><thead><tr><th>#</th><th>Canción</th><th style="text-align:right" title="Torneos ganados">🏆</th><th style="text-align:right">Duelos G–P</th><th style="text-align:right">% votos</th><th style="text-align:right">Votos</th></tr></thead><tbody>${rows.map((o, i) => `<tr><td class="pos">${i + 1}</td><td><b>${esc(o.t)}</b><div class="g">${esc(o.g)}</div></td><td class="n">${o.c || ""}</td><td class="n">${o.w}–${o.l}</td><td class="n">${o.vs ? Math.round(o.v / o.vs * 100) + "%" : "—"}</td><td class="n">${o.v}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="notice">Todavía no hay resultados. En cuanto se cierre el primer duelo de una partida empezará a llenarse.</div>`;
  const games = recs.length ? `<div class="games">${recs.map(r => {
    const ch = r.champ !== null ? r.songs[r.champ] : null;
    return `<div class="gm"><span class="d">${esc(fmtD(r.t))}</span><span>${r.size} canciones</span><span class="c">${ch ? "🏆 " + esc(ch[1]) + ` <span style="color:var(--muted);font-weight:400">· ${esc(ch[0])}</span>` : `En curso · ${r.res.length}/${r.size - 1} duelos`}</span>${r.players.length ? `<span class="p">Jugaron: ${r.players.map(esc).join(", ")}</span>` : ""}</div>`;
  }).join("")}</div>` : `<div class="notice">Aún no hay partidas guardadas.</div>`;
  return `<section class="top100">${back}
    <h2>Top 100 de canciones</h2>
    <p class="hint">Se calcula con todas las partidas que conoce este dispositivo. Se comparte entre todos los que jugáis juntos: cada vez que alguien entra en una sala, el anfitrión y él juntan sus historiales. Orden: torneos ganados, luego duelos ganados, luego % de votos.</p>
    ${table}
    <h2>Últimas partidas</h2>
    ${games}
  </section>`;
}

function libToText(lib){ return lib.map(s => s[0] + " | " + s[1] + ((s[2] && s[2].length) ? " | " + s[2].join(" ") : "")).join("\n"); }
function parseLib(text){
  const out = [];
  for (const raw of text.split("\n")) {
    const parts = raw.split("|").map(p => p.trim());
    if (parts.length < 2 || !parts[0] || !parts[1]) continue;
    const ids = (parts.slice(2).join(" ").split(/[\s,]+/)).map(ytId).filter(Boolean).slice(0, 5);
    out.push([parts[0].slice(0,80), parts[1].slice(0,80), ids]);
  }
  return out;
}
function renderSongs(){
  if (role !== "host") {
    const list = S ? S.songs : library;
    view.innerHTML = `<section class="songs"><p class="hint">${list.length} canciones ${S ? "en este torneo" : "en la lista"}. Solo el anfitrión puede editarla.</p><ol class="songlist">${list.map(s => `<li>${esc(s[1])} <span class="g">· ${esc(s[0])}</span></li>`).join("")}</ol></section>`;
    return;
  }
  if (libDirty && $("#lib")) return;
  view.innerHTML = `<section class="songs">
    <h2>Lista de canciones</h2>
    <p class="hint">Una canción por línea: <code>Juego | Canción | enlace de YouTube</code>. Puedes poner varios enlaces separados por espacios: si el primero no se deja ver incrustado, se usa el siguiente. Sin enlace, aparece un botón para buscarla en YouTube. Los cambios se usan en el próximo torneo.</p>
    <textarea id="lib" spellcheck="false" aria-label="Lista de canciones">${esc(libToText(library))}</textarea>
    <div class="row"><button class="btn primary" data-act="lib-save">Guardar lista</button><button class="btn ghost" data-act="lib-default">Restaurar lista original</button><span class="hint" id="libCount">${library.length} canciones</span></div>
  </section>`;
}

/* ---------- eventos ---------- */
function copyInvite(){
  const link = inviteLink();
  if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast("Enlace copiado"), () => toast(link));
  else toast(link);
}
document.addEventListener("click", e => {
  if (e.target.closest("#muteBtn")) { SFX.toggle(); paintMute(); SFX.play("click"); return; }
  const tb = e.target.closest(".tab");
  if (tb) { SFX.play("click"); tab = tb.dataset.tab; confirmReset = false; libDirty = false; render(); return; }
  if (e.target.closest("#codeChip")) { SFX.play("copy"); copyInvite(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a !== "vote" && !el.disabled) SFX.play("click");
  switch (a) {
    case "host": saveNick(); ls.del("vgm.host"); voters = {}; S = null; tab = "duel"; startHost(); break;
    case "host-resume": {
      saveNick();
      tab = "duel";
      try { const h = JSON.parse(ls.get("vgm.host")); S = h.S || null; voters = h.voters || {}; if (h.setup) setup = h.setup; for (const v of Object.values(voters)) v.on = false; startHost(h.code); resumeMini(); } catch { startHost(); }
      break;
    }
    case "join": {
      saveNick(); tab = "duel";
      const c = ($("#joinCode").value || "").trim().toUpperCase();
      if (!/^[A-Z0-9]{4}$/.test(c)) { toast("El código tiene 4 letras o números."); break; }
      startGuest(c); break;
    }
    case "copy": copyInvite(); break;
    case "show-top": tab = "top"; render(); break;
    case "home": tab = "duel"; render(); break;
    case "mini": if (S && S.status === "tie") startMini([]); break;
    case "mini-end": if (S && S.mini) finishMini(S.mini.id, teamRun && teamRun.mid === S.mini.id && teamRun.phase === "play" ? teamRun.G.result(teamRun.L) : undefined); break;
    case "mini-coin": coinFlip(""); break;
    case "size": setup.size = +el.dataset.v; render(); break;
    case "order": setup.order = el.dataset.v; render(); break;
    case "hidden": setup.hidden = el.dataset.v === "1"; render(); break;
    case "start": if (library.length >= setup.size) { S = newTournament(); for (const v of Object.values(voters)) { v.k = null; v.s = null; } broadcast(); render(); } break;
    case "vote": {
      if (!S || S.status !== "voting") break;
      const k = keyOf(S), me = voters[myId], cur = me && me.k === k ? me.s : null;
      const s = cur === el.dataset.side ? null : el.dataset.side;
      SFX.play(s ? "vote" : "unvote");
      if (role === "guest") { voters[myId] = Object.assign({}, me || {nick, on:true}, {k: s ? k : null, s}); renderLive(); }
      send({t:"vote", k, s}); break;
    }
    case "close": closeVoting(); break;
    case "pick": pickWinner(el.dataset.side, "pick"); break;
    case "coin": coinFlip(""); break;
    case "reopen": reopen(); break;
    case "next": nextMatch(); break;
    case "man": adjustManual(el.dataset.side, +el.dataset.d); break;
    case "reset": confirmReset = true; if (S && S.status === "done") render(); else renderStageState(); break;
    case "reset-no": confirmReset = false; if (S && S.status === "done") render(); else renderStageState(); break;
    case "reset-yes": confirmReset = false; clearTimeout(miniTimer); stopTeamRun(); S = null; closeMiniLayer(); for (const v of Object.values(voters)) { v.k = null; v.s = null; } broadcast(); tab = "duel"; render(); break;
    case "rtab": bracketRound = +el.dataset.v; render(); break;
    case "lib-save": {
      const songs = parseLib($("#lib").value);
      if (songs.length < 16) { toast("Hacen falta al menos 16 canciones válidas."); break; }
      library = songs; ls.set("vgm.library", JSON.stringify(songs)); libDirty = false; toast("Lista guardada"); render(); break;
    }
    case "lib-default": library = clone(DEFAULT_SONGS); ls.del("vgm.library"); libDirty = false; toast("Lista original restaurada"); render(); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "lib") { libDirty = true; const c = $("#libCount"); if (c) c.textContent = parseLib(e.target.value).length + " canciones (sin guardar)"; }
  if (e.target.id === "joinCode") e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "joinCode") { const b = document.querySelector('[data-act="join"]'); if (b) b.click(); }
});
function resumeMini(){
  if (role !== "host" || !S || S.status !== "mini") return;
  const tried = S.mini && Array.isArray(S.mini.tried) ? S.mini.tried.slice(0, -1) : [];
  S.status = "tie"; S.mini = null; render();
  setTimeout(() => { if (S && S.status === "tie") startMini(tried); }, 7000);
}
function saveNick(){ const i = $("#nick"); if (i) { nick = cleanNick(i.value); ls.set("vgm.nick", nick); } }

/* ---------- arranque ---------- */
const hashCode = (location.hash || "").replace("#", "").toUpperCase();
if (/^[A-Z0-9]{4}$/.test(hashCode)) {
  let mine = null; try { mine = JSON.parse(ls.get("vgm.host") || "null"); } catch {}
  if (mine && mine.code === hashCode) {
    S = mine.S || null; voters = mine.voters || {}; if (mine.setup) setup = mine.setup;
    for (const v of Object.values(voters)) v.on = false;
    startHost(hashCode); resumeMini();
  } else if (nick) startGuest(hashCode);
  else { ls.set("vgm.lastcode", hashCode); render(); toast("Escribe tu nombre y pulsa Entrar"); }
} else render();
})();
</script>
</body>
