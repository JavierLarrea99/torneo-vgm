<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Torneo VGM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: fighting-game "VS" stage — two challenger cards with embedded YouTube players facing off, vote bar under each, host controls under the stage. Single deliberate dark arcade look. */
:root{
  --bg:#13102a; --panel:#1d1840; --panel-2:#262054; --line:#3b3373;
  --fg:#efeaff; --muted:#a59ecb;
  --p1:#ff5d62; --p1-ink:#2a0608; --p2:#3db8ff; --p2-ink:#04192a;
  --gold:#ffc847; --gold-ink:#2b1d00; --ok:#5be39b;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --body:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --pixel:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),radial-gradient(1200px 500px at 50% -10%,#2b2163 0%,transparent 70%);}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:12px 48px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:4px 12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:22px;line-height:1;display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .dot{display:inline-flex;gap:3px}
.brand .dot i{width:9px;height:9px;display:block;background:var(--p1)}
.brand .dot i+i{background:var(--p2)}
.chip{font-family:var(--pixel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap}
.chip b{color:var(--fg);font-weight:400}
.chip.live b{color:var(--ok)}
.chip.code{cursor:pointer;color:var(--gold);border-color:var(--gold)}
.chip.code b{color:var(--gold);letter-spacing:.2em}

.tabs{display:flex;gap:4px;margin-block:12px 16px;overflow-x:auto}
.tab{font-family:var(--pixel);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.notice{border:1px dashed var(--line);padding:12px 14px;color:var(--muted);margin-bottom:14px;font-size:14px}
.notice strong{color:var(--fg)}

/* inicio */
.home{display:grid;gap:22px;max-width:760px;margin-top:10px}
.home h1{font-family:var(--display);font-size:clamp(30px,6vw,56px);line-height:1;margin:0;text-wrap:balance}
.home h1 span{color:var(--gold);text-shadow:3px 3px 0 var(--p1),-3px -3px 0 var(--p2)}
.home p{margin:0;color:var(--muted);max-width:62ch}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.choice{display:grid;gap:12px;padding:16px;border:1px solid var(--line);background:var(--panel);align-content:start}
.choice h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.choice p{font-size:14px}
.field{display:grid;gap:6px}
.field > span{font-family:var(--pixel);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);padding:10px 12px}
.inp.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--pixel);font-size:18px}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:10px 14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg small{display:block;font-weight:400;font-size:12px;opacity:.8}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:700;letter-spacing:.02em;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-family:var(--display);font-weight:400;font-size:17px;padding:12px 22px}
.btn.danger{background:transparent;color:var(--p1);border-color:color-mix(in srgb,var(--p1) 50%,var(--line))}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}

.lobby{display:grid;gap:18px;max-width:700px}
.lobby h1{font-family:var(--display);font-size:clamp(24px,4.5vw,38px);line-height:1.05;margin:0}
.lobby p{margin:0;color:var(--muted);max-width:62ch}
.invite{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--panel))}
.invite .big{font-family:var(--pixel);font-size:26px;letter-spacing:.3em;color:var(--gold)}
.invite .lnk{font-size:13px;color:var(--muted);overflow-wrap:anywhere;flex:1 1 220px;min-width:0}

/* escenario */
.meta{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:8px 14px;margin-bottom:12px;text-align:center}
.meta .round{font-family:var(--display);font-size:clamp(20px,3.6vw,30px);line-height:1}
.meta .count{font-family:var(--pixel);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--line);background:var(--panel)}
.meta .count b{color:var(--p1);font-weight:400}

.vs{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.vs-mark{position:absolute;left:50%;top:calc(50% - 50px);transform:translate(-50%,-50%) skewX(-8deg);z-index:2;font-family:var(--display);font-size:clamp(34px,5vw,64px);line-height:1;color:var(--gold);text-shadow:3px 3px 0 var(--p1),-3px -3px 0 var(--p2);pointer-events:none}
.card{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;transition:opacity .2s}
.frame{position:relative;aspect-ratio:16/9;width:100%;background:#000;border:4px solid var(--line);overflow:hidden}
.card.a .frame{border-color:var(--p1)}
.card.b .frame{border-color:var(--p2)}
.frame > div,.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.frame .fallback{display:grid;place-items:center;align-content:center;gap:10px;padding:16px;text-align:center;color:var(--muted);font-size:14px}
.label{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 14px;transform:skewX(-8deg);width:fit-content;max-width:100%}
.label > *{transform:skewX(8deg)}
.card.a .label{background:var(--p1);color:var(--p1-ink)}
.card.b .label{background:var(--p2);color:var(--p2-ink);margin-left:auto}
.label .song{font-family:var(--display);font-weight:400;font-size:clamp(16px,2.2vw,24px);line-height:1.1;margin:0;overflow-wrap:anywhere}
.label .game{font-weight:700;font-size:14px;opacity:.85;overflow-wrap:anywhere}
.vote{width:100%;font-family:var(--display);font-weight:400;font-size:18px;cursor:pointer;padding:12px 14px;border:0;color:#fff;letter-spacing:.04em}
.card.a .vote{background:color-mix(in srgb,var(--p1) 75%,#000)}
.card.b .vote{background:color-mix(in srgb,var(--p2) 70%,#000)}
.card.a .vote[aria-pressed="true"]{background:var(--p1);color:var(--p1-ink)}
.card.b .vote[aria-pressed="true"]{background:var(--p2);color:var(--p2-ink)}
.vote:disabled{opacity:.4;cursor:not-allowed}
.card.picked .frame{box-shadow:0 0 0 4px var(--gold)}
.card.lose{opacity:.4}
.card .crown{position:absolute;top:-12px;right:12px;z-index:3;font-family:var(--pixel);font-size:12px;letter-spacing:.08em;background:var(--gold);color:var(--gold-ink);padding:5px 10px;text-transform:uppercase}
.score{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.card.a .score{color:var(--p1)} .card.b .score{color:var(--p2)}
.score small{font-family:var(--pixel);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-left:6px}

.meter{display:flex;height:12px;margin-top:14px;border:1px solid var(--line);background:var(--panel)}
.meter i{display:block;height:100%;transition:width .5s}
.meter .ma{background:var(--p1)} .meter .mb{background:var(--p2);margin-left:auto}
.voters{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;min-height:28px}
.voters .lbl{font-family:var(--pixel);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.pill{font-size:13px;padding:3px 9px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:6px}
.pill i{width:7px;height:7px;display:block;background:var(--muted)}
.pill.voted i{background:var(--ok)} .pill.sa i{background:var(--p1)} .pill.sb i{background:var(--p2)}
.pill.off{opacity:.5}

.host{margin-top:18px;padding:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent);display:grid;gap:12px}
.host-h{font-family:var(--pixel);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.manual{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:14px;color:var(--muted)}
.manual .grp{display:inline-flex;align-items:center;gap:6px}
.manual .grp b{font-variant-numeric:tabular-nums;color:var(--fg);min-width:2ch;text-align:center}
.sq{width:32px;height:32px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:700}
.sq.a{color:var(--p1)} .sq.b{color:var(--p2)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* bracket */
.rtabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.rtabs button{font-family:var(--pixel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;white-space:nowrap}
.rtabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.m{border:1px solid var(--line);background:var(--panel);display:grid;font-size:14px}
.m.now{border-color:var(--gold)}
.m .mh{display:flex;justify-content:space-between;font-family:var(--pixel);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 0}
.m .mh .live{color:var(--gold)}
.m .ln{display:grid;grid-template-columns:4px 1fr auto;gap:8px;align-items:center;padding:6px 10px 6px 0}
.m .ln > i{height:100%;min-height:18px}
.m .ln.a > i{background:var(--p1)} .m .ln.b > i{background:var(--p2)}
.m .ln .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .ln .t em{font-style:normal;color:var(--muted)}
.m .ln .n{font-variant-numeric:tabular-nums;font-weight:700}
.m .ln.w .t{font-weight:700}
.m .ln.l .t{color:var(--muted);text-decoration:line-through}
.m .ln.tbd .t{color:var(--muted);font-style:italic}

/* campeón */
.champ{display:grid;gap:16px;justify-items:center;text-align:center}
.champ .eyebrow{font-family:var(--pixel);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.champ h1{font-family:var(--display);font-size:clamp(32px,7vw,68px);line-height:.98;margin:0;text-wrap:balance;color:var(--gold);text-shadow:4px 4px 0 var(--p1),-4px -4px 0 var(--p2)}
.champ .g{font-size:18px;font-weight:600;color:var(--muted)}
.champ .frame{max-width:720px;border-color:var(--gold)}
.path{width:100%;max-width:720px;border-collapse:collapse;font-size:14px;text-align:left}
.path td,.path th{padding:8px 10px;border-bottom:1px solid var(--line)}
.path th{font-family:var(--pixel);font-size:11px;font-weight:400;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.path td.n{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.tbl{overflow-x:auto;width:100%;display:flex;justify-content:center}

/* canciones */
.songs{display:grid;gap:16px}
.songs h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
textarea#lib{width:100%;min-height:420px;background:var(--panel);border:1px solid var(--line);padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;resize:vertical}
.hint{font-size:13px;color:var(--muted);max-width:80ch;margin:0}
.hint code{background:var(--panel);padding:1px 5px;border:1px solid var(--line)}
.songlist{columns:2 320px;column-gap:24px;margin:0;padding-left:2.6em;font-size:14px}
.songlist li{break-inside:avoid;padding:2px 0}
.songlist .g{color:var(--muted)}

/* quién votó qué */
.who{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:26px;font-size:13px}
.card.b .who{justify-content:flex-end}
.who .lbl{font-family:var(--pixel);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.who .nm{padding:2px 8px;font-weight:700}
.card.a .who .nm{background:color-mix(in srgb,var(--p1) 22%,var(--panel));border:1px solid var(--p1)}
.card.b .who .nm{background:color-mix(in srgb,var(--p2) 22%,var(--panel));border:1px solid var(--p2)}
.who .nm.me{outline:2px solid var(--gold)}
.pill .arrow{font-size:12px;opacity:.9}
.pill.sa{border-color:var(--p1)} .pill.sb{border-color:var(--p2)}
.pill.sa .arrow{color:var(--p1)} .pill.sb .arrow{color:var(--p2)}
.m .wv{padding:0 10px 7px 12px;font-size:12px;color:var(--muted);display:grid;gap:2px}
.m .wv b{font-weight:600}
.m .wv .va{color:color-mix(in srgb,var(--p1) 80%,var(--fg))} .m .wv .vb{color:color-mix(in srgb,var(--p2) 80%,var(--fg))}
.minires{margin-top:12px;padding:10px 14px;border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--panel));font-size:14px}
.minires b{color:var(--gold)}
.chip.btnchip{cursor:pointer;background:var(--panel)}

/* top */
.top100{display:grid;gap:18px}
.top100 h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.rank{width:100%;border-collapse:collapse;font-size:14px}
.rank th,.rank td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rank th{font-family:var(--pixel);font-size:10px;font-weight:400;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.rank td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rank td.pos{font-family:var(--display);color:var(--muted);width:3ch}
.rank tr:nth-child(1) td.pos{color:var(--gold)} .rank tr:nth-child(2) td.pos{color:#d6d9e6} .rank tr:nth-child(3) td.pos{color:#e0a271}
.rank .g{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
.games{display:grid;gap:8px}
.gm{border:1px solid var(--line);background:var(--panel);padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:14px}
.gm .d{font-family:var(--pixel);font-size:11px;color:var(--muted)}
.gm .c{font-weight:700}
.gm .p{color:var(--muted);font-size:13px;flex-basis:100%}

/* minijuegos */
#miniLayer{position:fixed;inset:0;z-index:20;background:rgba(10,8,26,.97);display:grid;place-items:center;padding:16px;overflow:auto}
.mini{width:min(560px,100%);display:grid;gap:14px;text-align:center}
.mini .eyebrow{font-family:var(--pixel);font-size:12px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
.mini h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,6vw,40px);line-height:1;margin:0;color:var(--fg);text-shadow:3px 3px 0 var(--p1),-3px -3px 0 var(--p2)}
.mini .ref{color:var(--muted);font-size:14px}
.mini .how{font-size:15px}
.mini .team{display:inline-block;padding:6px 12px;font-weight:700}
.mini .team.a{background:var(--p1);color:var(--p1-ink)} .mini .team.b{background:var(--p2);color:var(--p2-ink)}
.mini .count{font-family:var(--display);font-size:72px;line-height:1;color:var(--gold)}
.arena{position:relative;min-height:300px;border:3px solid var(--line);background:var(--panel);display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
.arena .big{font-family:var(--display);font-size:clamp(40px,12vw,96px);line-height:1}
.arena .sub{font-family:var(--pixel);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.arena .hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;font-family:var(--pixel);font-size:13px;color:var(--muted)}
.arena .hud b{color:var(--fg);font-weight:400}
.arena.flash{background:#fff}
.arena.flash .big{color:#c01818}
.mashbtn{width:190px;height:190px;border-radius:50%;border:0;background:var(--p1);color:#fff;font-family:var(--display);font-size:32px;cursor:pointer;box-shadow:0 10px 0 color-mix(in srgb,var(--p1) 50%,#000)}
.mashbtn:active{transform:translateY(6px);box-shadow:0 4px 0 color-mix(in srgb,var(--p1) 50%,#000)}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:44px 16px 16px;width:100%}
.hole{aspect-ratio:1;border-radius:50%;border:0;background:#3a2a1a;cursor:pointer;font-size:clamp(30px,9vw,54px);display:grid;place-items:center;box-shadow:inset 0 8px 0 #20160d}
.hole.up{background:#7a5332}
.notes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:52px 12px 16px}
.note{width:64px;height:64px;border-radius:50%;border:3px solid #000;font-family:var(--display);font-size:24px;cursor:pointer;color:#111}
.note.A{background:#3db8ff} .note.U,.note.D,.note.L,.note.R{background:var(--gold)}
.note.lit{filter:brightness(1.6);transform:scale(1.12)}
.note:disabled{cursor:default}
.seqbar{font-family:var(--pixel);font-size:13px;color:var(--muted);position:absolute;bottom:10px;left:0;right:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;padding:12px}
.opts button{padding:16px;font-family:var(--display);font-size:26px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.qst{font-family:var(--display);font-size:clamp(34px,9vw,56px);padding-top:40px}
.prog{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.prog .pill.done i{background:var(--ok)}
.mini .res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini .res div{padding:12px;border:2px solid var(--line)}
.mini .res .a{border-color:var(--p1)} .mini .res .b{border-color:var(--p2)}
.mini .res strong{font-family:var(--display);font-size:30px;display:block}

.tug{width:100%;padding:52px 16px 14px;display:grid;gap:8px}
.tugbar{position:relative;height:30px;background:linear-gradient(90deg,var(--p1) 0 50%,var(--p2) 50% 100%);border:2px solid #000}
.tugbar::before,.tugbar::after{content:"";position:absolute;top:-6px;bottom:-6px;width:4px;background:#fff}
.tugbar::before{left:0} .tugbar::after{right:0}
.tugbar .flag{position:absolute;top:-14px;width:10px;height:54px;background:var(--gold);left:50%;transform:translateX(-50%);transition:left .12s linear;box-shadow:0 0 0 2px #000}
.tugl{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}
.tugl .a{color:var(--p1)} .tugl .b{color:var(--p2);text-align:right}
.tugbtn.b{background:var(--p2);box-shadow:0 10px 0 color-mix(in srgb,var(--p2) 50%,#000)}
.turf{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:44px 10px 8px;width:min(100%,400px);margin:0 auto}
.cell{aspect-ratio:1;border:0;background:#2b2550;cursor:pointer;transition:background .12s}
.cell:disabled{cursor:default}
.cell.a{background:var(--p1)} .cell.b{background:var(--p2)}
.buzz{width:100%;padding:44px 12px 12px;display:grid;gap:10px}
.buzz .bq{font-family:var(--display);font-size:clamp(20px,5vw,30px);line-height:1.15}
.buzz .opts{padding:0}
.buzz .opts button{font-family:var(--body);font-weight:700;font-size:16px;padding:14px 10px}
.buzz .opts button.ok{background:var(--ok);color:#06210f;border-color:var(--ok)}
.buzz .opts button:disabled{opacity:.55;cursor:default}
.buzz .opts button.ok:disabled{opacity:1}
.buzz .bmsg{min-height:22px;font-weight:700;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .vs{grid-template-columns:1fr;gap:12px}
  .vs-mark{position:static;transform:skewX(-8deg);justify-self:center;font-size:36px;order:0}
  .card.b{order:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function loadLibrary(){
  try { const l = JSON.parse(ls.get("vgm.library") || "null"); if (Array.isArray(l) && l.length >= 16) { const d = new Map(DEFAULT_SONGS.map(x => [x[0] + "|" + x[1], x[2]])); for (const x of l) { const ids = Array.isArray(x) && d.get(x[0] + "|" + x[1]); if (ids) x[2] = ids.slice(); } return l; } } catch {}
  return clone(DEFAULT_SONGS);
}

/* ---------- torneo ---------- */
const sizeOf = st => st.rounds[0].length;
const roundName = (st, r) => ROUND_NAMES[sizeOf(st) >> r] || ("Ronda " + (r+1));
const matchesIn = (st, r) => sizeOf(st) >> (r+1);
const lastRound = st => Math.log2(sizeOf(st)) - 1;
const keyOf = st => st.gid + ":" + st.cur.r + ":" + st.cur.m;
const pair = (st, r, m) => [st.rounds[r][2*m], st.rounds[r][2*m+1]];
function doneMatches(st){ let n = 0; for (let r = 1; r < st.rounds.length; r++) for (const w of st.rounds[r]) if (w !== null) n++; return n; }

function newTournament(){
  let idx = library.map((_, i) => i);
  if (setup.order === "random") for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  idx = idx.slice(0, setup.size);
  const songs = idx.map(i => clone(library[i]));
  const rounds = [songs.map((_, i) => i)];
  for (let k = setup.size/2; k >= 1; k /= 2) rounds.push(Array(k).fill(null));
  return {gid: rid(6), t: Date.now(), songs, rounds, scores:{}, who:{}, miniLog:{}, cur:{r:0, m:0}, status:"voting", hidden:setup.hidden, manual:{a:0,b:0}, reveal:null, mini:null};
}

function tally(){
  const res = {a:0, b:0, list:[]};
  const k = S ? keyOf(S) : "-";
  for (const [id, v] of Object.entries(voters)) {
    const voted = v.k === k && (v.s === "a" || v.s === "b");
    if (voted) res[v.s]++;
    res.list.push({id, nick: v.nick || "Jugador", s: voted ? v.s : null, on: v.on, me: id === myId});
  }
  if (S && S.manual) { res.a += S.manual.a || 0; res.b += S.manual.b || 0; }
  return res;
}

const HIST_MAX = 60;
function histLoad(){ try { const h = JSON.parse(ls.get("vgm.hist") || "{}"); return h && typeof h === "object" && !Array.isArray(h) ? h : {}; } catch { return {}; } }
let hist = histLoad();
function histSave(){
  let recs = Object.values(hist).sort((x, y) => y.u - x.u);
  if (recs.length > HIST_MAX) { recs = recs.slice(0, HIST_MAX); hist = Object.fromEntries(recs.map(r => [r.id, r])); }
  let txt = JSON.stringify(hist);
  while (txt.length > 1500000 && recs.length > 5) { recs.pop(); hist = Object.fromEntries(recs.map(r => [r.id, r])); txt = JSON.stringify(hist); }
  ls.set("vgm.hist", txt);
}
const s80 = v => String(v ?? "").replace(/[\p{Cc}\p{Cf}]/gu, "").slice(0, 80);
function cleanRec(r){
  if (!r || typeof r !== "object" || typeof r.id !== "string" || !/^[A-Z0-9]{6}$/.test(r.id)) return null;
  if (!Array.isArray(r.songs) || r.songs.length < 2 || r.songs.length > 256) return null;
  const songs = r.songs.map(x => Array.isArray(x) ? [s80(x[0]), s80(x[1])] : ["?", "?"]), n = songs.length;
  const res = (Array.isArray(r.res) ? r.res : []).slice(0, 255)
    .filter(m => Array.isArray(m) && m.length === 5)
    .map(m => [m[0] | 0, m[1] | 0, Math.max(0, Math.min(999, m[2] | 0)), Math.max(0, Math.min(999, m[3] | 0)), m[4] ? 1 : 0])
    .filter(m => m[0] >= 0 && m[0] < n && m[1] >= 0 && m[1] < n && m[0] !== m[1]);
  const champ = Number.isInteger(r.champ) && r.champ >= 0 && r.champ < n ? r.champ : null;
  const players = (Array.isArray(r.players) ? r.players : []).slice(0, 40).map(cleanNick).filter(Boolean);
  const t = Math.max(0, Number(r.t) || 0), u = Math.max(t, Number(r.u) || 0);
  return {id: r.id, t, u, size: n, songs, res, champ, players};
}
function histMerge(recs){
  const changed = [];
  for (const raw of (Array.isArray(recs) ? recs : []).slice(0, 200)) {
    const r = cleanRec(raw); if (!r) continue;
    const cur = hist[r.id];
    if (!cur || r.u > cur.u || (r.u === cur.u && r.res.length > cur.res.length)) { hist[r.id] = r; changed.push(r); }
  }
  if (changed.length) histSave();
  return changed;
}
function recFromS(st){
  const res = [];
  for (let r = 0; r < st.rounds.length - 1; r++) for (let m = 0; m < (st.rounds[r].length >> 1); m++) {
    const w = st.rounds[r+1][m], sc = st.scores[r + "-" + m];
    if (w === null || w === undefined) continue;
    const [ia, ib] = pair(st, r, m);
    if (ia === null || ib === null) continue;
    res.push([ia, ib, sc ? sc[0] : 0, sc ? sc[1] : 0, w === ib ? 1 : 0]);
  }
  const champ = st.rounds[lastRound(st) + 1][0];
  const prev = hist[st.gid];
  const players = Array.from(new Set([...(prev ? prev.players : []), ...Object.values(voters).map(v => cleanNick(v.nick)).filter(Boolean)])).slice(0, 40);
  return {id: st.gid, t: st.t || Date.now(), u: Date.now(), size: sizeOf(st), songs: st.songs.map(s => [s[0], s[1]]), res, champ: Number.isInteger(champ) ? champ : null, players};
}
function recordProgress(){
  if (role !== "host" || !S) return;

}
function topStats(){
  const m = new Map();
  const get = s => { const k = s[0] + "|" + s[1]; let o = m.get(k); if (!o) { o = {g: s[0], t: s[1], w: 0, l: 0, v: 0, vs: 0, c: 0, apps: 0}; m.set(k, o); } return o; };
  for (const r of Object.values(hist)) {
    const seen = new Set();
    for (const s of r.songs) { const o = get(s); if (!seen.has(o)) { o.apps++; seen.add(o); } }
    for (const [ia, ib, va, vb, w] of r.res) {
      const A = get(r.songs[ia]), B = get(r.songs[ib]);
      A.v += va; B.v += vb; A.vs += va + vb; B.vs += va + vb;
      if (w) { B.w++; A.l++; } else { A.w++; B.l++; }
    }
    if (r.champ !== null) get(r.songs[r.champ]).c++;
  }
  const pct = o => o.vs ? o.v / o.vs : 0;
  return [...m.values()].filter(o => o.w + o.l > 0)
    .sort((x, y) => y.c - x.c || y.w - x.w || pct(y) - pct(x) || y.v - x.v || x.l - y.l)
    .slice(0, 100);
}

function setupHostConn(c){
  c.on("open", () => { conns.set(c.peer, c); });
  c.on("data", d => onHostData(c, d));
  c.on("close", () => { if (conns.get(c.peer) === c) conns.delete(c.peer); for (const v of Object.values(voters)) if (v.peer === c.peer) v.on = false; broadcast(); renderLive(); setNet(); updateMiniProgress(); });
  c.on("error", () => {});
}
function openHostPeer(){
  if (typeof Peer === "undefined") { setNet(); return; }
  try { if (peer) peer.destroy(); } catch {}
  peer = new Peer(PEER_PREFIX + code, peerOpts);
  peer.on("open", () => { setNet(); broadcast(); render(); });
  peer.on("connection", setupHostConn);
  peer.on("disconnected", () => { setTimeout(() => { try { peer.reconnect(); } catch {} }, 1500); });
  peer.on("error", e => {
    if (e.type === "unavailable-id") {
      if (!ls.get("vgm.host")) { code = rid(4); history.replaceState(null, "", "#" + code); startHostRelay(); render(); }
      setTimeout(openHostPeer, 3000);
    } else if (e.type === "network" || e.type === "server-error" || e.type === "socket-error" || e.type === "socket-closed") {
      setTimeout(openHostPeer, 4000);
    }
  });
}

function onHostData(c, d){
  if (!d || typeof d !== "object") return;
  const id = typeof d.id === "string" ? d.id.slice(0, 20) : null;
  if (!id || id === myId) return;
  if (d.t === "hello") {
    const prev = voters[id] || {k:null, s:null};
    if (!prev.on) SFX.play("join");
    voters[id] = {nick: cleanNick(d.nick) || "Jugador", k: prev.k, s: prev.s, on: true, peer: c.peer};
    broadcast(); renderLive(); setNet(); updateMiniProgress();
    if (d.first) sendHistTo(c);
  } else if (d.t === "hist") {
    const changed = histMerge(d.recs);
    if (changed.length) { sendAll({t:"hist", recs: changed}); if (tab === "top") render(); }
  } else if (d.t === "mini" && voters[id]) {
    miniSubmit(id, d.mid, d.sc);
  } else if (d.t === "mact" && voters[id]) {
    teamAct(id, d);
  } else if (d.t === "vote" && voters[id] && S && S.status === "voting") {
    if (d.k === keyOf(S) && (d.s === "a" || d.s === "b" || d.s === null)) { voters[id].k = d.s ? d.k : null; voters[id].s = d.s; broadcast(); renderLive(); }
  } else if (d.t === "nick" && voters[id]) {
    voters[id].nick = cleanNick(d.nick) || "Jugador"; broadcast(); renderLive();
  }
}

/* ---------- plan B: relé por servidor MQTT público cuando la conexión directa no sale ---------- */
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt", "wss://test.mosquitto.org:8081"];
const relayBase = c => "torneovgm/v2/" + c;
const FORCE_RELAY = /[?&]relay=1/.test(location.search);
const mqttReady = () => typeof mqtt !== "undefined" && typeof mqtt.connect === "function";
function mqttClient(url){ return mqtt.connect(url, {clientId: "tvgm_" + rid(12), clean: true, reconnectPeriod: 3000, connectTimeout: 7000, keepalive: 30}); }
class RelayConn {
  constructor(client, peerName, sendFn){ this.client = client; this.peer = peerName; this.open = false; this.h = {}; this.relay = true; this.seen = Date.now(); this._send = sendFn; }
  on(e, f){ this.h[e] = f; return this; }
  emit(e, x){ try { this.h[e] && this.h[e](x); } catch (err) { console.error(err); } }
  send(d){ if (this.open) this._send(d); }
  close(){ if (!this.open) return; this.open = false; this.emit("close"); }
}
const pub = (cl, topic, obj) => { try { cl.publish(topic, JSON.stringify(obj)); } catch {} };

/* anfitrión: escucha en los tres servidores a la vez */
let relayClients = [], relayConns = new Map(), relayIv = null, relayUp = 0;
function stopHostRelay(){
  clearInterval(relayIv); relayIv = null;
  for (const rc of relayConns.values()) rc.close();
  relayConns.clear();
  for (const cl of relayClients) { try { cl.end(true); } catch {} }
  relayClients = []; relayUp = 0;
}
function startHostRelay(){
  stopHostRelay();
  if (!mqttReady() || !code) return;
  const base = relayBase(code), myCode = code;
  for (const url of BROKERS) {
    let cl; try { cl = mqttClient(url); } catch { continue; }
    let up = false;
    cl.on("connect", () => { cl.subscribe(base + "/up", {qos: 0}); if (!up) { up = true; relayUp++; setNet(); } });
    cl.on("close", () => { if (up) { up = false; relayUp = Math.max(0, relayUp - 1); setNet(); } });
    cl.on("error", () => {});
    cl.on("message", (topic, buf) => {
      if (code !== myCode) return;
      let m; try { m = JSON.parse(buf.toString()); } catch { return; }
      const gid = typeof m.from === "string" && /^[A-Za-z0-9]{4,24}$/.test(m.from) ? m.from : null; if (!gid) return;
      const out = base + "/down/" + gid;
      let rc = relayConns.get(gid);
      if (m.k === "open") {
        if (rc && rc.client !== cl) { relayConns.delete(gid); rc.close(); rc = null; }
        if (!rc) { rc = new RelayConn(cl, "mq-" + gid, d => pub(cl, out, {k: "d", d})); relayConns.set(gid, rc); setupHostConn(rc); }
        rc.seen = Date.now();
        pub(cl, out, {k: "ack"});
        if (!rc.open) { rc.open = true; rc.emit("open"); }
        return;
      }
      if (!rc || rc.client !== cl) { if (m.k === "d" || m.k === "ping") pub(cl, out, {k: "who"}); return; }
      rc.seen = Date.now();
      if (m.k === "d") rc.emit("data", m.d);
      else if (m.k === "bye") { relayConns.delete(gid); rc.close(); }
    });
    relayClients.push(cl);
  }
  relayIv = setInterval(() => {
    const now = Date.now();
    for (const [gid, rc] of relayConns) {
      if (now - rc.seen > 17000) { relayConns.delete(gid); rc.close(); }
      else pub(rc.client, relayBase(code) + "/down/" + gid, {k: "ping"});
    }
  }, 5000);
}

/* invitado: prueba directo y, si no sale, por servidor */
let relayMode = FORCE_RELAY, relayClient = null, relayHB = null;
const relayGid = "g" + myId.replace(/[^A-Za-z0-9]/g, "").slice(0, 16);
function stopGuestRelay(){
  clearInterval(relayHB); relayHB = null;
  if (relayClient) { try { pub(relayClient, relayBase(code) + "/up", {k: "bye", from: relayGid}); relayClient.end(true); } catch {} relayClient = null; }
}
function goRelay(why){
  if (relayMode && relayClient) return;
  relayMode = true;
  const old = hostConn; hostConn = null;
  try { if (old && !old.relay) old.close(); } catch {}
  startGuestRelay(0);
}
function startGuestRelay(i){
  clearTimeout(reconnectT);
  if (!mqttReady()) { setNet("Sin conexión. Reintentando…"); reconnectT = setTimeout(() => startGuestRelay(0), 5000); return; }
  stopGuestRelay();
  if (i >= BROKERS.length) { setNet("El anfitrión no responde. Reintentando…"); reconnectT = setTimeout(() => startGuestRelay(0), 4000); return; }
  setNet("Conectando por servidor…");
  const base = relayBase(code), cl = mqttClient(BROKERS[i]); relayClient = cl;
  const rc = new RelayConn(cl, "host", d => pub(cl, base + "/up", {k: "d", from: relayGid, d}));
  let acked = false;
  const fail = setTimeout(() => { if (!acked && relayClient === cl) startGuestRelay(i + 1); }, 8000);
  cl.on("error", () => {});
  cl.on("connect", () => {
    cl.subscribe(base + "/down/" + relayGid, {qos: 0}, () => pub(cl, base + "/up", {k: "open", from: relayGid}));
  });
  cl.on("message", (topic, buf) => {
    if (relayClient !== cl) return;
    let m; try { m = JSON.parse(buf.toString()); } catch { return; }
    rc.seen = Date.now();
    if (m.k === "ack") { if (!acked) { acked = true; clearTimeout(fail); attachGuestConn(rc); rc.open = true; rc.emit("open"); } }
    else if (m.k === "who") pub(cl, base + "/up", {k: "open", from: relayGid});
    else if (m.k === "d") rc.emit("data", m.d);
  });
  relayHB = setInterval(() => {
    if (relayClient !== cl) return;
    if (!acked) return;
    pub(cl, base + "/up", {k: "ping", from: relayGid});
    if (Date.now() - rc.seen > 17000) { rc.close(); }
  }, 5000);
}
function sendHistTo(c){
  const recs = Object.values(hist);
  for (let i = 0; i < recs.length; i += 6) { try { c.send({t: "hist", id: myId, recs: recs.slice(i, i + 6)}); } catch {} }
}

function startGuest(c){
  role = "guest"; code = c.toUpperCase();
  history.replaceState(null, "", "#" + code);
  ls.set("vgm.lastcode", code);
  render();
  if (relayMode || typeof Peer === "undefined") { goRelay(); return; }
  setNet("Conectando…");
  peer = new Peer(undefined, peerOpts);
  const noSignal = setTimeout(() => { if (!relayMode && !(hostConn && hostConn.open)) goRelay(); }, 7000);
  peer.on("open", () => { clearTimeout(noSignal); connectToHost(); });
  peer.on("disconnected", () => { if (!relayMode) setTimeout(() => { try { peer.reconnect(); } catch {} }, 1500); });
  peer.on("error", e => {
    if (relayMode) return;
    if (e.type === "peer-unavailable" || ["network","server-error","socket-error","socket-closed","browser-incompatible","webrtc"].includes(e.type)) goRelay();
  });
}
function scheduleReconnect(){ clearTimeout(reconnectT); reconnectT = setTimeout(connectToHost, 3000); }
function connectToHost(){
  if (relayMode) { startGuestRelay(0); return; }
  if (!peer || peer.destroyed) { goRelay(); return; }
  if (peer.disconnected) { try { peer.reconnect(); } catch {} scheduleReconnect(); return; }
  try { if (hostConn) hostConn.close(); } catch {}
  const c = peer.connect(PEER_PREFIX + code, {reliable: true});
  setNet("Conectando…");
  attachGuestConn(c);
  setTimeout(() => { if (c === hostConn && !c.open && !relayMode) goRelay(); }, 7000);
}
function attachGuestConn(c){
  hostConn = c;
  c.on("open", () => {
    if (c !== hostConn) return;
    setNet(); c.send({t:"hello", id: myId, nick: nick || "Jugador", first: true});
    sendHistTo(c);
    const hi = setInterval(() => { if (c !== hostConn || !c.open) return clearInterval(hi); if (!S) { try { c.send({t:"hello", id: myId, nick: nick || "Jugador"}); } catch {} } else clearInterval(hi); }, 3000);
  });
  c.on("data", d => {
    if (!d || c !== hostConn) return;
    if (d.t === "hist") { if (histMerge(d.recs).length && tab === "top") render(); return; }
    if (d.t === "live") { liveIn(d); return; }
    if (d.t !== "state") return;
    const prevKey = S ? keyOf(S) : null, prevDone = !!S && S.status === "done";
    S = d.S || null; voters = d.voters || {};
    const newKey = S ? keyOf(S) : null;
    if (prevKey !== newKey || !S || (S.status === "done") !== prevDone) render(); else { renderStageState(); renderLive(); }
    setNet(); syncMini(); stateSounds();
  });
  c.on("close", () => { if (c === hostConn) { setNet("Reconectando…"); scheduleReconnect(); } });
  c.on("error", () => {});
}
function send(msg){
  msg.id = myId;
  if (role === "host") { onHostLocal(msg); return; }
  if (hostConn && hostConn.open) { try { hostConn.send(msg); } catch {} }
  else toast("Sin conexión con el anfitrión. Reintentando…");
}
function onHostLocal(msg){
  if (msg.t === "mini") { miniSubmit(myId, msg.mid, msg.sc); return; }
  if (msg.t === "mact") { teamAct(myId, msg); return; }
  if (msg.t === "vote" && S && S.status === "voting") { voters[myId].k = msg.s ? msg.k : null; voters[myId].s = msg.s; }
  if (msg.t === "nick") voters[myId].nick = cleanNick(msg.nick) || "Anfitrión";
  broadcast(); renderLive();
}
let netOverride = null;
function setNet(txt){
  netOverride = txt || null;
  const nc = $("#netChip"); if (!role) { nc.hidden = true; return; }
  nc.hidden = false;
  if (netOverride) { nc.className = "chip"; nc.textContent = netOverride; return; }
  const on = Object.values(voters).filter(v => v.on).length;
  if (role === "guest" && !(hostConn && hostConn.open)) { nc.className = "chip"; nc.textContent = "Conectando…"; return; }
  if (role === "host" && !(peer && peer.open) && !relayUp) { nc.className = "chip"; nc.textContent = "Abriendo sala…"; return; }
  nc.className = "chip live";
  nc.innerHTML = (role === "host" ? "Anfitrión · " : "") + "<b>" + on + "</b> conectados" + (role === "guest" && hostConn && hostConn.relay ? " · vía servidor" : "");
}

/* ---------- acciones del anfitrión ---------- */
function act(fn){ if (role !== "host" || !S) return; fn(S); broadcast(); stateSounds(); syncMini(); }
function closeVoting(){
  const t = tally();
  const {a, b} = t;
  act(n => {
    const {r, m} = n.cur, key = r + "-" + m, mm = n.manual || {a:0, b:0};
    n.scores[key] = [a, b]; n.reveal = {a, b};
    n.who = n.who || {};
    n.who[key] = {a: t.list.filter(v => v.s === "a").map(v => v.nick), b: t.list.filter(v => v.s === "b").map(v => v.nick), ma: mm.a || 0, mb: mm.b || 0};
    if (a === b) { n.status = "tie"; return; }
    n.rounds[r+1][m] = a > b ? n.rounds[r][2*m] : n.rounds[r][2*m+1];
    n.status = "reveal";
  });
  if (S.status === "tie") startMini([]); else recordProgress();
  renderStageState(); renderLive();
}
function setWinner(n, side){ const {r, m} = n.cur; n.rounds[r+1][m] = n.rounds[r][2*m + (side === "a" ? 0 : 1)]; n.status = "reveal"; }
function pickWinner(side, how){
  clearTimeout(miniTimer); stopTeamRun();
  act(n => {
    setWinner(n, side);
    if (how) { n.miniLog = n.miniLog || {}; n.miniLog[n.cur.r + "-" + n.cur.m] = {g: how, w: side}; }
  });
  recordProgress(); renderStageState(); renderLive();
}
function coinFlip(why){
  const side = Math.random() < .5 ? "a" : "b";
  if (why) toast(why + ". Decide la moneda.");
  pickWinner(side, "coin");
}
function reopen(){
  clearTimeout(miniTimer); stopTeamRun();
  act(n => { const {r, m} = n.cur, key = r + "-" + m; n.rounds[r+1][m] = null; delete n.scores[key]; if (n.who) delete n.who[key]; if (n.miniLog) delete n.miniLog[key]; n.reveal = null; n.mini = null; n.status = "voting"; });
  recordProgress(); renderStageState(); renderLive();
}
function nextMatch(){
  act(n => {
    let {r, m} = n.cur;
    if (r === lastRound(n)) { n.status = "done"; return; }
    m++; if (m >= matchesIn(n, r)) { r++; m = 0; }
    n.cur = {r, m}; n.status = "voting"; n.reveal = null; n.manual = {a:0, b:0}; n.mini = null;
  });
  if (S.status === "done") recordProgress();
  bracketRound = null; render();
}
function adjustManual(side, d){ act(n => { n.manual[side] = Math.max(0, (n.manual[side]||0) + d); }); renderStageState(); renderLive(); }

/* ---------- sonidos según cambia el estado ---------- */
let sndKey = null, sndStatus = null, sndInit = false;
function stateSounds(){
  const k = S ? keyOf(S) : null, st = S ? S.status : null;
  if (sndInit && k === sndKey && st === sndStatus) return;
  const first = !sndInit, sameMatch = k === sndKey, prevSt = sndStatus;
  sndInit = true; sndKey = k; sndStatus = st;
  if (first || !S) return;
  if (st === "done") SFX.play("fanfare");
  else if (!sameMatch && st === "voting") SFX.play("next");
  else if (st === "reveal") { SFX.play("close"); setTimeout(() => SFX.play("win"), 260); }
  else if (st === "tie" || (st === "mini" && !(sameMatch && prevSt === "tie"))) SFX.play("tie");
}

let ytReady = false, ytQueue = [];
window.onYouTubeIframeAPIReady = () => { ytReady = true; ytQueue.splice(0).forEach(f => f()); };
(function loadYT(){ const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.onerror = () => toast("No se pudo cargar YouTube."); document.head.appendChild(s); })();
const players = {};
function destroyPlayers(){ for (const k of Object.keys(players)) { try { players[k].p && players[k].p.destroy(); } catch {} delete players[k]; } }
function mountPlayer(slot, song){
  const host = document.getElementById("yt-" + slot);
  if (!host) return;
  const ids = (song[2] || []).map(ytId).filter(Boolean);
  const fallback = () => {
    const box = document.getElementById("yt-" + slot) || host;
    const wrap = box.closest(".frame");
    if (wrap) wrap.innerHTML = `<div class="fallback"><span>No hay vídeo que se pueda reproducir aquí para esta canción.</span><a class="btn sm" href="${esc(searchUrl(song))}" target="_blank" rel="noopener">Buscar en YouTube</a></div>`;
  };
  if (!ids.length) { fallback(); return; }
  const go = () => {
    const st = {i:0, ids};
    players[slot] = st;
    st.p = new YT.Player("yt-" + slot, {
      videoId: ids[0], width: "100%", height: "100%",
      playerVars: {rel:0, modestbranding:1, playsinline:1, origin: location.origin},
      events: {
        onError: () => {
          st.i++;
          if (st.i < st.ids.length) { try { st.p.cueVideoById(st.ids[st.i]); } catch { fallback(); } }
          else { try { st.p.destroy(); } catch {} fallback(); }
        },
        onStateChange: e => {
          if (e.data === 1) for (const [k, o] of Object.entries(players)) if (k !== slot && o.p && o.p.pauseVideo) { try { o.p.pauseVideo(); } catch {} }
        }
      }
    });
  };
  if (ytReady && window.YT && YT.Player) go(); else ytQueue.push(go);
}

function onKey(fn){ const h = e => { if (e.code === "Space" || e.key === " ") { e.preventDefault(); if (!e.repeat) fn(); } }; document.addEventListener("keydown", h); return () => document.removeEventListener("keydown", h); }

function runKirby(ar, R, done){
  let round = 0, total = 0, state = "wait", t0 = 0, timer = null;
  ar.innerHTML = `<div class="hud"><span>Ronda <b id="kr">1</b>/3</span><span>Puntos <b id="kp">0</b></span></div><div><div class="big" id="kb">…</div><div class="sub" id="ks">Espera…</div></div>`;
  const set = (b, s) => { ar.querySelector("#kb").textContent = b; ar.querySelector("#ks").textContent = s; };
  function startRound(){
    state = "wait"; ar.classList.remove("flash"); set("…", "Espera…");
    ar.querySelector("#kr").textContent = round + 1;
    timer = setTimeout(() => {
      state = "go"; t0 = performance.now(); ar.classList.add("flash"); set("¡!", "¡Ahora!"); SFX.play("go");
      timer = setTimeout(() => { if (state === "go") end(0, "Demasiado lento"); }, 1500);
    }, 1300 + R() * 3200);
  }
  function end(pts, msg){
    state = "pause"; ar.classList.remove("flash"); total += pts; round++;
    ar.querySelector("#kp").textContent = total; set(pts ? "+" + pts : "0", msg);
    timer = setTimeout(round >= 3 ? () => done(total) : startRound, 1300);
  }
  function press(){
    if (state === "wait") { clearTimeout(timer); SFX.play("miss"); end(0, "¡Demasiado pronto!"); }
    else if (state === "go") { clearTimeout(timer); const ms = Math.round(performance.now() - t0); SFX.play("hit"); end(Math.max(0, 1000 - ms), ms + " ms"); }
  }
  ar.addEventListener("pointerdown", press);
  const offK = onKey(press);
  startRound();
  return () => { clearTimeout(timer); ar.removeEventListener("pointerdown", press); offK(); };
}

function runMash(ar, R, done){

  return () => { clearInterval(iv); offK(); };
}

function runOcarina(ar, R, done){

  const light = k => { const b = btns.find(x => x.dataset.k === k); b.classList.add("lit"); SFX.play("note", KEYS.find(x => x[0] === k)[2]); timers.push(setTimeout(() => b.classList.remove("lit"), 300)); };
  const status = s => ar.querySelector("#os").textContent = s;
  function finish(){ if (finished) return; finished = true; busy = true; btns.forEach(b => b.disabled = true); timers.push(setTimeout(() => done(best), 900)); }
  function play(){
    busy = true; pos = 0; btns.forEach(b => b.disabled = true); status("Escucha…");
    ar.querySelector("#ol").textContent = len;
    for (let i = 0; i < len; i++) timers.push(setTimeout(() => light(seq[i]), 600 + i * 520));
    timers.push(setTimeout(() => { busy = false; btns.forEach(b => b.disabled = false); status("¡Tu turno!"); }, 600 + len * 520 + 150));
  }
  const onClick = e => {
    const b = e.target.closest(".note"); if (!b || busy) return;
    const k = b.dataset.k; light(k);
    if (k !== seq[pos]) { SFX.play("miss"); status("¡Fallo! Récord: " + best + " notas"); finish(); return; }
    pos++;
    if (pos >= len) {
      best = len; ar.querySelector("#ob").textContent = best;
      if (len >= seq.length) { status("¡Perfecto!"); finish(); return; }
      busy = true; status("¡Bien!"); SFX.play("hit"); len++; timers.push(setTimeout(play, 700));
    }
  };
  ar.addEventListener("click", onClick);
  const cap = setTimeout(() => { status("¡Tiempo!"); finish(); }, 66000);
  play();
  return () => { timers.forEach(clearTimeout); clearTimeout(cap); ar.removeEventListener("click", onClick); };
}

function runDiglett(ar, R, done){
  const DUR = 15000, events = [];
  for (let t = 500; t < DUR - 600;) { events.push({t, h: Math.floor(R() * 9), bomb: R() < .2, up: 700 + R() * 450}); t += 380 + R() * 420; }
  let score = 0, left = 15, timers = [];
  ar.innerHTML = `<div class="hud"><span>Tiempo <b id="dt">15</b>s</span><span>Puntos <b id="dp">0</b></span></div><div class="holes">${Array.from({length: 9}, (_, i) => `<button class="hole" type="button" data-h="${i}" aria-label="Agujero ${i+1}"></button>`).join("")}</div>`;
  const holes = [...ar.querySelectorAll(".hole")];
  const state = Array(9).fill(null);
  const show = (h, bomb) => { state[h] = bomb ? "b" : "d"; holes[h].classList.add("up"); holes[h].textContent = bomb ? "💣" : "🟤"; holes[h].setAttribute("aria-label", bomb ? "Voltorb" : "Diglett"); };
  const hide = h => { state[h] = null; holes[h].classList.remove("up"); holes[h].textContent = ""; holes[h].setAttribute("aria-label", "Agujero"); };
  for (const ev of events) {
    timers.push(setTimeout(() => { if (!state[ev.h]) { show(ev.h, ev.bomb); timers.push(setTimeout(() => hide(ev.h), ev.up)); } }, ev.t));
  }
  const onDown = e => {
    const b = e.target.closest(".hole"); if (!b) return;
    const h = +b.dataset.h;
    if (state[h] === "d") { score++; SFX.play("hit"); hide(h); }
    else if (state[h] === "b") { score -= 2; SFX.play("boom"); hide(h); }
    ar.querySelector("#dp").textContent = score;
  };
  ar.addEventListener("pointerdown", onDown);
  const iv = setInterval(() => { left--; ar.querySelector("#dt").textContent = Math.max(0, left); if (left <= 0) { clearInterval(iv); holes.forEach((_, i) => hide(i)); ar.removeEventListener("pointerdown", onDown); SFX.play("go"); timers.push(setTimeout(() => done(Math.max(0, score)), 900)); } }, 1000);
  return () => { timers.forEach(clearTimeout); clearInterval(iv); ar.removeEventListener("pointerdown", onDown); };
}

function runBrain(ar, R, done){
  let score = 0, left = 20, live = true, cur = null;
  const qs = Array.from({length: 60}, () => {
    const k = R(); let a, b, op, ans;
    if (k < .4) { a = 2 + Math.floor(R() * 40); b = 2 + Math.floor(R() * 40); op = "+"; ans = a + b; }
    else if (k < .7) { a = 10 + Math.floor(R() * 50); b = 1 + Math.floor(R() * a); op = "−"; ans = a - b; }
    else { a = 2 + Math.floor(R() * 8); b = 2 + Math.floor(R() * 8); op = "×"; ans = a * b; }
    const opts = new Set([ans]);
    while (opts.size < 4) { const d = (1 + Math.floor(R() * 6)) * (R() < .5 ? -1 : 1); if (ans + d >= 0) opts.add(ans + d); }
    const arr = [...opts]; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return {q: `${a} ${op} ${b}`, ans, opts: arr};
  });

  ar.innerHTML = `<div class="hud"><span>Tiempo <b id="bt">20</b>s</span><span>Puntos <b id="bp">0</b></span></div><div style="width:100%"><div class="qst" id="bq"></div><div class="opts" id="bo"></div></div>`;
  function show(){ cur = qs[qi % qs.length]; qi++; ar.querySelector("#bq").textContent = cur.q + " = ?"; ar.querySelector("#bo").innerHTML = cur.opts.map(o => `<button type="button" data-v="${o}">${o}</button>`).join(""); }
  const onClick = e => {
    const b = e.target.closest("#bo button"); if (!b || !live) return;

    ar.querySelector("#bp").textContent = score; show();

  ar.addEventListener("click", onClick);

  return () => { clearInterval(iv); ar.removeEventListener("click", onClick); };
}

/* anfitrión: bucle del minijuego por equipos */
const TEAM_INTRO = 7;
let teamRun = null;
function stopTeamRun(){ if (teamRun) clearInterval(teamRun.iv); teamRun = null; }
function startTeamRun(M, G){
  stopTeamRun();
  const size = {a: 0, b: 0}; Object.values(M.teams).forEach(s => size[s]++);
  teamRun = {mid: M.id, G, L: G.init(M, rng(M.seed)), size, t0: performance.now(), phase: "intro", last: {}};
  teamRun.iv = setInterval(teamTick, 120);
  teamTick();
}
function teamTick(){
  const T = teamRun;
  if (!T || role !== "host" || !S || S.status !== "mini" || !S.mini || S.mini.id !== T.mid) { stopTeamRun(); return; }
  const el = (performance.now() - T.t0) / 1000;
  let left;
  if (el < TEAM_INTRO) { T.phase = "intro"; left = Math.ceil(TEAM_INTRO - el); }
  else {
    if (T.phase === "intro") { T.phase = "play"; T.p0 = performance.now(); }
    const pe = (performance.now() - T.p0) / 1000;
    if (T.G.tick) T.G.tick(T.L, pe);
    left = Math.max(0, Math.ceil(T.G.secs - pe));
    if (left <= 0 || (T.G.done && T.G.done(T.L))) {
      T.phase = "end"; publishLive(T, 0);
      const r = T.G.result(T.L), mid = T.mid; stopTeamRun();
      setTimeout(() => finishMini(mid, r), 1800);
      return;
    }
  }
  publishLive(T, left);
}
function publishLive(T, left){
  const P = Object.assign({phase: T.phase, left}, T.G.pub(T.L));
  sendAll({t: "live", mid: T.mid, P});
  liveIn({mid: T.mid, P});
}
function teamAct(pid, d){
  const T = teamRun;
  if (!T || !S || !S.mini || !d || d.mid !== T.mid || T.phase !== "play") return;
  const side = S.mini.teams[pid]; if (!side) return;
  try { T.G.act(T.L, side, pid, d.a, T); } catch {}
}

/* cada jugador: pinta el estado que manda el anfitrión */
let liveView = null;
function liveIn(d){
  if (!d || !d.P || !S || !S.mini || S.mini.id !== d.mid) return;
  liveView = d; paintTeam();
}
function paintTeam(){
  const M = S && S.status === "mini" ? S.mini : null;
  if (!M || !liveView || liveView.mid !== M.id || !miniLocal || miniLocal.mid !== M.id) return;
  const G = gameById(M.g); if (!G || !G.team) return;
  const P = liveView.P, my = M.teams[myId], stage = $("#miniStage"); if (!stage) return;
  if (P.phase === "intro") {
    const c = $("#miniCount");
    if (c && c.textContent !== String(P.left)) { c.textContent = P.left; if (P.left <= 3) SFX.play("tick"); }
    return;
  }
  if (!miniLocal.built) {
    miniLocal.built = true; SFX.play("go");
    stage.innerHTML = `<div class="arena" id="arena"></div>`;
    miniLocal.cleanup = G.build($("#arena"), my, a => send({t: "mact", mid: M.id, a}));
  }
  const ar = $("#arena"); if (ar) G.paint(ar, P, my);
  if (P.phase === "end" && !miniLocal.ended) { miniLocal.ended = true; if (miniLocal.cleanup) { try { miniLocal.cleanup(); } catch {} miniLocal.cleanup = null; } SFX.play("go"); }
}

/* lado del anfitrión */
let miniTimer = null;
function startMini(tried){
  if (role !== "host" || !S) return;
  tried = Array.isArray(tried) ? tried : [];
  const k = keyOf(S), on = id => voters[id] && voters[id].on;
  let A = Object.keys(voters).filter(id => on(id) && voters[id].k === k && voters[id].s === "a");
  let B = Object.keys(voters).filter(id => on(id) && voters[id].k === k && voters[id].s === "b");
  let mixed = false;
  if (!A.length || !B.length) {
    const all = Object.keys(voters).filter(on);
    for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
    if (all.length < 2) { coinFlip("No hay jugadores suficientes para el minijuego"); return; }
    A = all.filter((_, i) => i % 2 === 0); B = all.filter((_, i) => i % 2 === 1); mixed = true;
  }
  const pool = MINIGAMES.filter(g => !tried.includes(g.id)), list = pool.length ? pool : MINIGAMES;
  const G = list[Math.floor(Math.random() * list.length)];
  const teams = {}; A.forEach(id => teams[id] = "a"); B.forEach(id => teams[id] = "b");
  const seed = crypto.getRandomValues(new Uint32Array(1))[0];
  act(n => { n.status = "mini"; n.mini = {id: rid(6), g: G.id, seed, teams, res: {}, tried: [...tried, G.id], mixed}; });
  clearTimeout(miniTimer); stopTeamRun();
  const mid = S.mini.id;
  if (G.team) startTeamRun(S.mini, G);
  else miniTimer = setTimeout(() => finishMini(mid), (G.dur + 16) * 1000);
  renderStageState(); renderLive();
}
function miniSubmit(pid, mid, sc){
  if (role !== "host" || !S || S.status !== "mini" || !S.mini || S.mini.id !== mid) return;
  const M = S.mini; if (!M.teams[pid] || M.res[pid] !== undefined) return;
  M.res[pid] = Math.max(0, Math.min(100000, Math.round(Number(sc) || 0)));
  broadcast(); updateMiniProgress(); renderStageState();
  const pending = Object.keys(M.teams).filter(id => M.res[id] === undefined && voters[id] && voters[id].on);
  if (!pending.length) setTimeout(() => finishMini(mid), 1200);
}
function teamAvg(M, side){
  const ids = Object.keys(M.teams).filter(id => M.teams[id] === side && (M.res[id] !== undefined || (voters[id] && voters[id].on)));
  if (!ids.length) return 0;
  return Math.round(ids.reduce((s, id) => s + (M.res[id] || 0), 0) / ids.length * 10) / 10;
}
function finishMini(mid, ov){
  if (role !== "host" || !S || S.status !== "mini" || !S.mini || S.mini.id !== mid) return;
  clearTimeout(miniTimer); stopTeamRun();
  const M = S.mini, a = ov ? ov.a : teamAvg(M, "a"), b = ov ? ov.b : teamAvg(M, "b");
  if (a === b) {
    if (M.tried.length < 3) { toast("¡Empate también en el minijuego! Va otro."); startMini(M.tried); }
    else coinFlip("Empate en 3 minijuegos seguidos");
    return;
  }
  const side = a > b ? "a" : "b";
  act(n => { setWinner(n, side); n.miniLog = n.miniLog || {}; n.miniLog[n.cur.r + "-" + n.cur.m] = {g: M.g, a, b, w: side}; });
  recordProgress(); renderStageState(); renderLive();
}

/* lado de cada jugador: capa a pantalla completa */
let miniLocal = null;
function pauseAll(){ for (const o of Object.values(players)) { try { o.p && o.p.pauseVideo && o.p.pauseVideo(); } catch {} } }
function closeMiniLayer(){
  if (miniLocal) { (miniLocal.timers || []).forEach(clearTimeout); if (miniLocal.cleanup) { try { miniLocal.cleanup(); } catch {} } }
  miniLocal = null;
  const el = $("#miniLayer"); if (el) el.remove();
}
function syncMini(){
  const M = S && S.status === "mini" ? S.mini : null;
  const G = M ? gameById(M.g) : null;
  if (!M || !G) { if (miniLocal || $("#miniLayer")) closeMiniLayer(); return; }
  if (!miniLocal || miniLocal.mid !== M.id) {
    closeMiniLayer(); pauseAll();
    const el = document.createElement("div"); el.id = "miniLayer"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Minijuego de desempate");
    document.body.appendChild(el);
    const [ia, ib] = pair(S, S.cur.r, S.cur.m), my = M.teams[myId];
    const teamTag = side => `<span class="team ${side}">${esc(S.songs[side === "a" ? ia : ib][1])}</span>`;
    el.innerHTML = `<div class="mini">
      <span class="eyebrow">¡Empate! Minijuego de desempate${M.tried.length > 1 ? " · intento " + M.tried.length : ""}</span>
      <h2>${esc(G.name)}</h2>
      <div class="ref">${esc(G.ref)}</div>
      <div id="miniStage"></div>
      <div id="miniProg"></div>
      <div id="miniHost"></div>
    </div>`;
    miniLocal = {mid: M.id, timers: [], cleanup: null};
    const stage = $("#miniStage");
    if (G.team) {
      stage.innerHTML = `<p class="how">${esc(G.how)}</p><p>${my ? "Juegas por " + teamTag(my) + (M.mixed ? " (equipos sorteados)" : "") : "Miras: " + teamTag("a") + " contra " + teamTag("b")}</p><div class="count" id="miniCount">${TEAM_INTRO}</div>`;
      paintTeam();
    } else if (my && M.res[myId] === undefined) {
      stage.innerHTML = `<p class="how">${esc(G.how)}</p><p>Juegas por ${teamTag(my)}${M.mixed ? " (equipos sorteados)" : ""}</p><div class="count" id="miniCount">3</div>`;
      const loc = miniLocal;
      let c = 3; SFX.play("tick");
      const step = () => {
        if (miniLocal !== loc) return;
        c--;
        if (c > 0) { $("#miniCount").textContent = c; SFX.play("tick"); loc.timers.push(setTimeout(step, 800)); }
        else {
          SFX.play("go");
          stage.innerHTML = `<div class="arena" id="arena"></div>`;
          loc.cleanup = G.run($("#arena"), rng(M.seed), score => {
            if (miniLocal !== loc || loc.sent) return;
            loc.sent = true; try { loc.cleanup && loc.cleanup(); } catch {} loc.cleanup = null;
            stage.innerHTML = `<p class="how">Tu puntuación: <b style="color:var(--gold);font-size:22px">${score}</b><br>Esperando al resto…</p>`;
            send({t:"mini", mid: M.id, sc: score});
          });
        }
      };
      loc.timers.push(setTimeout(step, 4200));
    } else if (my) {
      stage.innerHTML = `<p class="how">Ya has jugado. Esperando al resto…</p>`;
    } else {
      stage.innerHTML = `<p class="how">Este desempate lo juegan ${teamTag("a")} contra ${teamTag("b")}. Tú miras cómo va.</p>`;
    }
  }
  updateMiniProgress();
}
function updateMiniProgress(){
  const box = $("#miniProg"); if (!box || !S || !S.mini) return;
  const M = S.mini, [ia, ib] = pair(S, S.cur.r, S.cur.m);
  const list = side => Object.keys(M.teams).filter(id => M.teams[id] === side).map(id => {
    const v = voters[id] || {}, d = M.res[id] !== undefined;
    return `<span class="pill ${d ? "done" : ""} ${v.on ? "" : "off"}"><i></i>${esc(v.nick || "Jugador")}${id === myId ? " (tú)" : ""}${d ? " · <b>" + M.res[id] + "</b>" : ""}</span>`;
  }).join("");
  box.innerHTML = `<div class="res"><div class="a"><span>Equipo ${esc(S.songs[ia][1])}</span><div class="prog">${list("a")}</div></div><div class="b"><span>Equipo ${esc(S.songs[ib][1])}</span><div class="prog">${list("b")}</div></div></div>`;
  const hb = $("#miniHost");
  if (hb) hb.innerHTML = role === "host" ? `<div class="row" style="justify-content:center"><button class="btn sm" data-act="mini-end">Terminar ya</button><button class="btn sm ghost" data-act="mini-coin">Decidir con moneda</button></div>` : "";
}
function miniBanner(){
  if (!S) return "";
  const key = S.cur.r + "-" + S.cur.m, L = S.miniLog && S.miniLog[key];
  if (!L || S.status === "voting") return "";
  const [ia, ib] = pair(S, S.cur.r, S.cur.m), w = S.songs[L.w === "a" ? ia : ib][1];
  if (L.g === "coin") return `<div class="minires">Desempate a cara o cruz: pasa <b>${esc(w)}</b>.</div>`;
  if (L.g === "pick") return `<div class="minires">El anfitrión ha decidido el desempate: pasa <b>${esc(w)}</b>.</div>`;
  const G = gameById(L.g);
  return `<div class="minires">Desempate en <b>${esc(G ? G.name : "minijuego")}</b>: equipo ${esc(S.songs[ia][1])} ${L.a} – ${L.b} equipo ${esc(S.songs[ib][1])}. Pasa <b>${esc(w)}</b>.</div>`;
}

/* ---------- render ---------- */
function render(){
  destroyPlayers();
  const inRoom = !!role;
  $("#tabs").hidden = !inRoom;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  const rc = $("#roundChip"), cc = $("#codeChip");
  rc.hidden = !S; cc.hidden = !code;
  if (S) rc.innerHTML = S.status === "done" ? "<b>Torneo terminado</b>" : "<b>" + esc(roundName(S, S.cur.r)) + "</b> · " + (S.cur.m+1) + "/" + matchesIn(S, S.cur.r);
  if (code) cc.innerHTML = "Sala <b>" + esc(code) + "</b>";
  setNet(netOverride); paintMute();
  if (!inRoom) { view.innerHTML = tab === "top" ? renderTop() : renderHome(); return; }
  if (tab === "duel") {
    view.innerHTML = renderDuel();
    if (!S) renderLive();
    else if (S.status !== "done") { const [ia, ib] = pair(S, S.cur.r, S.cur.m); mountPlayer("a", S.songs[ia]); mountPlayer("b", S.songs[ib]); renderStageState(); renderLive(); }
    else { const fin = lastRound(S); mountPlayer("c", S.songs[S.rounds[fin+1][0]]); }
  } else if (tab === "bracket") view.innerHTML = renderBracket();
  else if (tab === "top") view.innerHTML = renderTop();
  else renderSongs();
}

function inviteLink(){ return location.origin + location.pathname + "#" + code; }

function renderHome(){
  const last = ls.get("vgm.lastcode") || "";
  const hostSaved = ls.get("vgm.host");
  return `<section class="home">
    <h1>Bracket de <span>bandas sonoras</span></h1>
    <p>Duelos 1 contra 1 entre canciones de videojuegos. Escucháis las dos aquí mismo, votáis cada uno desde su PC y la más votada pasa de ronda hasta que quede una campeona.</p>
    <label class="field"><span>Tu nombre</span><input class="inp" id="nick" maxlength="20" placeholder="Por ejemplo: Fitxi" value="${esc(nick)}" autocomplete="off"></label>
    <div class="choices">
      <div class="choice">
        <h2>Crear sala</h2>
        <p>Eres el anfitrión: eliges el tamaño del bracket, cierras cada votación y pasas al siguiente duelo.</p>
        <button class="btn primary" data-act="host">Crear sala</button>
        ${hostSaved ? `<button class="btn ghost" data-act="host-resume">Volver a mi sala anterior</button>` : ""}
      </div>
      <div class="choice">
        <h2>Unirme</h2>
        <p>Escribe el código de 4 letras que te pase el anfitrión, o abre directamente su enlace.</p>
        <input class="inp code" id="joinCode" maxlength="4" placeholder="ABCD" value="${esc(last)}" autocomplete="off" aria-label="Código de sala">
        <button class="btn" data-act="join">Entrar</button>
      </div>
    </div>
    <div><button class="btn ghost" data-act="show-top">🏆 Ver el Top 100 y las últimas partidas</button></div>
  </section>`;
}

function renderDuel(){
  if (!S) {
    if (role === "host") return renderLobby();
    return `<div class="lobby"><h1>Esperando al anfitrión</h1><p>Estás en la sala ${esc(code)}. En cuanto el anfitrión empiece el torneo aparecerá aquí el primer duelo.</p></div>`;
  }
  if (S.status === "done") return renderChampion();
  return renderStage();
}

function renderLobby(){
  const n = library.length;
  const sizeBtns = SIZES.map(sz => `<button type="button" data-act="size" data-v="${sz}" aria-pressed="${setup.size===sz}" ${n < sz ? "disabled" : ""}>${sz}<small>${Math.log2(sz)} rondas · ${sz-1} duelos</small></button>`).join("");
  return `<section class="lobby">
    <div class="invite"><span>Código de la sala</span><span class="big">${esc(code)}</span><span class="lnk" id="invLink">${esc(inviteLink())}</span><button class="btn sm" data-act="copy">Copiar enlace</button></div>
    <h1>Prepara el torneo</h1>
    <div class="field"><span>Tamaño del bracket</span><div class="seg">${sizeBtns}</div></div>
    <div class="field"><span>Emparejamientos</span><div class="seg">
      <button type="button" data-act="order" data-v="random" aria-pressed="${setup.order==="random"}">Al azar</button>
      <button type="button" data-act="order" data-v="list" aria-pressed="${setup.order==="list"}">En el orden de la lista</button>
    </div></div>
    <div class="field"><span>Votos durante el duelo</span><div class="seg">
      <button type="button" data-act="hidden" data-v="1" aria-pressed="${setup.hidden}">Ocultos hasta cerrar</button>
      <button type="button" data-act="hidden" data-v="0" aria-pressed="${!setup.hidden}">En directo</button>
    </div></div>
    <p class="hint">Hay ${n} canciones en la lista. ${n > setup.size ? (setup.order==="random" ? `Entran ${setup.size} al azar.` : `Entran las ${setup.size} primeras.`) : ""} Puedes cambiar la lista en la pestaña Canciones.</p>
    <div class="voters" id="voters"></div>
    <div><button class="btn primary" data-act="start" ${n < setup.size ? "disabled" : ""}>Empezar torneo</button></div>
